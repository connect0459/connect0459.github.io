repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']
        exclude: '^src/assets/fonts/.*\.(woff|woff2|otf)$'

  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: npm run lint:md:fix
        language: system
        files: \.(md|mdx)$
        pass_filenames: false

      - id: prettier
        name: Prettier
        entry: npm run format
        language: system
        files: \.(astro|ts|js|mjs|css|json)$
        pass_filenames: false

      - id: eslint
        name: ESLint
        entry: npm run lint:fix
        language: system
        files: \.(astro|ts|js|mjs)$
        pass_filenames: false

      - id: typecheck
        name: Astro Type Check
        entry: npm run typecheck
        language: system
        files: \.(astro|ts|js|mjs)$
        pass_filenames: false
